<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheep Meadow</title>
<link rel="icon" href="../store/play-icon-512.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#E8EFE2}
  #wd-top{position:fixed;top:0;left:0;right:0;height:44px;z-index:10;
    display:flex;align-items:center;gap:8px;background:#2E6B3E;color:#fff;
    padding:0 8px 0 14px;box-shadow:0 2px 8px rgba(0,0,0,.15);
    font:600 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans",sans-serif}
  #wd-top.hide{display:none}
  #wd-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #wd-cta{background:#F6C445;color:#2E6B3E;border-radius:999px;padding:7px 14px;
    font-weight:800;text-decoration:none;white-space:nowrap;flex-shrink:0}
  #wd-x{background:transparent;border:none;color:#fff;font-size:19px;line-height:1;
    cursor:pointer;padding:6px 8px;flex-shrink:0}
  #wd-frame{position:fixed;top:44px;left:0;right:0;bottom:0;border:0;width:100%;height:calc(100% - 44px)}
  #wd-top.hide + #wd-frame{top:0;height:100%}
</style>
</head>
<body>
<div id="wd-top">
  <span id="wd-text"></span>
  <a id="wd-cta" target="_blank" rel="noopener" href="https://play.google.com/store/apps/details?id=com.cityg.caoyuan&referrer=utm_source%3Dwebdemo%26utm_medium%3Dbanner"></a>
  <button id="wd-x" aria-label="Close" type="button">&times;</button>
</div>
<iframe id="wd-frame" src="game.html" title="Sheep Meadow"></iframe>
<script>
(function(){
  var bar=document.getElementById('wd-top');
  try{ if(localStorage.getItem('wdBannerHidden')) bar.classList.add('hide'); }catch(e){}
  var L=(navigator.language||'en').toLowerCase();
  var T = /^zh-(tw|hk|mo)/.test(L) ? {t:'喜歡這款遊戲？',c:'去 Play 裝'} :
          L.indexOf('zh')===0       ? {t:'喜欢这款游戏？',c:'去 Play 装'} :
          L.indexOf('ja')===0       ? {t:'気に入りましたか？',c:'Playで入手'} :
          L.indexOf('es')===0       ? {t:'¿Te gusta?',c:'En Play'} :
                                       {t:'Enjoying it?',c:'Get it on Play'};
  document.getElementById('wd-text').textContent=T.t;
  document.getElementById('wd-cta').textContent=T.c;
  document.getElementById('wd-x').onclick=function(){
    bar.classList.add('hide');
    try{ localStorage.setItem('wdBannerHidden','1'); }catch(err){}
  };
})();
</script>
</body>
</html>
